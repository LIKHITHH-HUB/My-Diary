  <body>
    <body>

<!--3d-BACKGROUND -->
<div class="hero-bg">
  <canvas id="particles"></canvas>
  <div class="glow"></div>
</div>

<!-- CONTENT -->
<div class="main-container">

  <div class="post">
    <h1 id="title"></h1>
    <p id="description"></p>
  </div>

  <div class="actions">
    <button class="btn btn-secondary" onclick="goBack()">Back</button>
    <!-- <button class="btn btn-danger" onclick="deletePost()">Delete</button> -->
    <button class="btn btn-warning" onclick="editPost()">Edit</button>
  </div>

</div>

</body>
  
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
<script>
const post = JSON.parse(localStorage.getItem("selectedPost"));

document.getElementById("title").innerText = post.postTitle;
document.getElementById("description").innerText = post.postDescription;
//go back 
function goBack(){
  window.location.href = "./Feedpage.html";
}
//delete post
async function deletePost(){
  const confirmDelete = confirm("Are you sure");
  if(!confirmDelete) return;

  await fetch(`https://my-diary-backend-kge5.onrender.com/deletepost`,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body: JSON.stringify({id:post.ID})
  });

alert("Post deleted");
window.location.href = "./Feedpage.html";
}
//edit post
function editPost(){
  localStorage.setItem("editPost",JSON.stringify(post));
  window.location.href="./Post.html";
  console.log("Edit clicked",post);
}
</script>
<!-- 3d -->
 <script>
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particlesArray = [];

class Particle {
  constructor(){
    this.x = Math.random()*canvas.width;
    this.y = Math.random()*canvas.height;
    this.size = Math.random()*2;
    this.speedX = Math.random()*0.5 - 0.25;
    this.speedY = Math.random()*0.5 - 0.25;
  }

  update(){
    this.x += this.speedX;
    this.y += this.speedY;

    if(this.x<0 || this.x>canvas.width) this.speedX *= -1;
    if(this.y<0 || this.y>canvas.height) this.speedY *= -1;
  }

  draw(){
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fill();
  }
}

/* CREATE PARTICLES */
for(let i=0;i<120;i++){
  particlesArray.push(new Particle());
}

/* ANIMATE */
function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particlesArray.forEach(p=>{
    p.update();
    p.draw();
  });

  requestAnimationFrame(animate);
}

animate();

/* RESIZE FIX */
window.addEventListener("resize", ()=>{
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>

  </body>
