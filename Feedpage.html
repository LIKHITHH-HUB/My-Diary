<script>
   const userId = localStorage.getItem('userId');

fetch(`http://localhost:3000/getmyposts?userId=${userId}`)
.then(res => res.json())
.then(data => {

  const welcome = document.getElementById("welcomeSection");
  const postsContainer = document.getElementById("postsSection");

  //  CLEAR OLD POSTS (IMPORTANT)
  postsContainer.innerHTML = "";

  if(data.length === 0){
    // SHOW ONLY WELCOME
    welcome.style.display = "flex";
    postsContainer.style.display = "none";
  } else {
    // SHOW ONLY POSTS
    welcome.style.display = "none";
    postsContainer.style.display = "block";
  }

  data.forEach(post => {
  const div = document.createElement('div');
  div.classList.add('post');

  div.innerHTML = `
    <h4>${post.postTitle}</h4>
    <p>${post.postDescription}</p>

    <div style="display:flex; gap:10px; margin-top:10px;">
      <button class="btn btn-info text-white" onclick='viewPost(${JSON.stringify(post)})'>
        ViewPost
      </button>

      <button class="btn btn-warning" onclick='editPost(${JSON.stringify(post)})'>
        Edit
      </button>

      <button class="btn btn-danger" onclick='deletePost(${post.Id})'>
        Delete
      </button>
    </div>
  `;

  document.getElementById("postsSection").appendChild(div);
});

});
</script>
<script>
function viewPost(post){
  localStorage.setItem("selectedPost", JSON.stringify(post));
  window.location.href = "./Viewpostpage.html";
}

function editPost(post){
  localStorage.setItem("editPost", JSON.stringify(post));
  window.location.href = "./Post.html";
}
function createNewPost(){
  localStorage.removeItem("editPost");  // CLEAR OLD DATA
  window.location.href = "https://likhithh-hub.github.io/My-Diary/Post.html";
}
</script>

<!-- 3d -->
 <script>
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particlesArray = [];

class Particle {
  constructor(){
    this.x = Math.random()*canvas.width;
    this.y = Math.random()*canvas.height;
    this.size = Math.random()*2;
    this.speedX = Math.random()*0.5 - 0.25;
    this.speedY = Math.random()*0.5 - 0.25;
  }

  update(){
    this.x += this.speedX;
    this.y += this.speedY;

    if(this.x<0 || this.x>canvas.width) this.speedX *= -1;
    if(this.y<0 || this.y>canvas.height) this.speedY *= -1;
  }

  draw(){
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fill();
  }
}

/* CREATE PARTICLES */
for(let i=0;i<120;i++){
  particlesArray.push(new Particle());
}

/* ANIMATE */
function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particlesArray.forEach(p=>{
    p.update();
    p.draw();
  });

  requestAnimationFrame(animate);
}

animate();

/* RESIZE FIX */
window.addEventListener("resize", ()=>{
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
<script>
  async function deletePost(id){
  console.log("DELETE CLICKED ID:", id);   // DEBUG

  const confirmDelete = confirm("Are you sure to delete?");
  if(!confirmDelete) return;

  const response = await fetch('http://localhost:3000/deletepost', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ id })
  });

  console.log("STATUS:", response.status);   //  DEBUG

  const text = await response.text();        //  DEBUG
  console.log("RESPONSE TEXT:", text);

  if(response.status === 200){
    alert("Deleted successfully");
    location.reload();
  } else {
    alert("Delete failed: " + text);
  }
}

</script>
