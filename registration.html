<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="registration.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Special+Gothic+Expanded+One&family=Zalando+Sans+Expanded:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">  
</head>

  <body class="d-flex justify-content-center align-items-center" style="height:100vh;">
    <!-- 3d-animate -->
     <div class="hero">

  <!-- LEFT TEXT -->
  <div class="hero-text">
    <p>
      Capture your thoughts,<br>
      express your heart,<br>
      and relive your moments.
    </p>
  </div>

  <!-- RIGHT VISUAL -->
  <div class="hero-visual">
    <div class="heart"></div>
    <div class="heart small"></div>
    <div class="heart big"></div>
  </div>

</div>

<!-- login card -->
    <div class="card login-card" style="width: 500px">
  <div class="card-body text-center">
    <h1 class="card-title">Welcome</h1>
    <p class="card-text">please Register to continue</p>
    <form action="" class="text-start" id="registrationForm">
        <div class="mb-3">
  <label for="emailInput" class="form-label">Email address</label>
  <input type="email" class="form-control" name="email" id="emailInput" placeholder="name@example.com">
</div>
<div class="mb-3">
  <label for="passwordInput" class="form-label">Set Password</label>
  <input type="password" class="form-control" name="password" id="passwordInput">
</div>
<p>Already have an account? <a href="index.html">Login Here</a></p>
  <button type="submit" class="btn w-100" id="LoginButton">Register</button>
    </form>
    <!-- <a href="#" class="btn w-100" id="LoginButton">Login</a> -->
  </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

<script>
  const form = document.getElementById('registrationForm');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const formData = new URLSearchParams(new FormData(form));
  
  const response = await fetch('http://localhost:3000/registerUser',{
    method: 'post',
    headers:{
      'content-Type' : 'application/x-www-form-urlencoded'
    },
    body : formData
  });

  const message = await response.text();

if (response.status === 200) {
    alert(message);
    window.location.href = "./index.html";
} 
else if (response.status === 409) {
    alert(message);
} 
else {
    alert("Registration failed. Please try again.");
}
});
</script>
  </body>
</html>
